name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts

      - name: Test (full suite, all extras)
        run: >-
          uv run --python ${{ matrix.python-version }}
          --extra api --extra image --extra mcp --extra video
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the zero-build front-end (every module)
        run: for f in frontend/*.js; do node --check "$f" || exit 1; done

  ui:
    # Browser tests: a real server + headless Chromium drive the web app
    # (vessel/tissue editing, zoom-accurate clicks, run, prune + undo, explorer).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Chromium for Playwright
        run: uv run --extra api --extra image --extra ui playwright install --with-deps chromium

      - name: Browser tests
        run: uv run --extra api --extra image --extra ui pytest tests/ui -q
